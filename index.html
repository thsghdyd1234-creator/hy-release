*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans);overflow-x:clip;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
img{max-width:100%}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
[hidden]{display:none!important}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.fill{fill:currentColor}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:10px max(16px,min(4vw,51px));display:flex;align-items:center;gap:10px 20px;flex-wrap:wrap;min-height:64px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:18px;letter-spacing:-.01em;text-decoration:none;white-space:nowrap}
.brand svg{width:22px;height:22px}
.exams{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:var(--pill);background:var(--soft)}
.exams button{min-height:38px;padding:0 16px;border:0;border-radius:var(--pill);background:none;color:var(--ink2);font-weight:600;font-size:15px;cursor:pointer;white-space:nowrap}
.exams button[aria-selected=true]{background:var(--ink);color:var(--onfill)}
.tabs{display:flex;gap:2px;margin-left:auto}
.tabs a{display:flex;align-items:center;min-height:44px;padding:0 12px;text-decoration:none;color:var(--ink2);font-weight:500;white-space:nowrap}
.tabs a[aria-current=page]{color:var(--ink);font-weight:700;box-shadow:inset 0 -2px 0 var(--red)}
.sync{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--mute)}
.sync[data-s=on] i{background:var(--ink);border-color:var(--ink)}
.sync[data-s=saving] i{background:var(--red);border-color:var(--red)}
.sync[data-s=warn] i{border-color:var(--red)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;display:none;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;text-decoration:none;font-size:13px;color:var(--mute)}
.tabbar a[aria-current=page]{color:var(--ink);font-weight:700}
.tabbar a[aria-current=page] .ic{color:var(--red)}
main{display:block;max-width:1240px;margin:0 auto;padding:28px max(16px,min(4vw,51px)) 72px;outline:none}
main:focus,main:focus-visible{outline:none}
@media (max-width:859px){.tabs{display:none}.tabbar{display:grid}.top-in{min-height:0;padding-top:8px;padding-bottom:8px}.exams{order:3;width:100%}.exams button{flex:1;padding:0 8px}.sync{margin-left:auto}main{padding-top:20px;padding-bottom:calc(100px + env(safe-area-inset-bottom))}}
body[data-route=quiz] .top,body[data-route=quiz] .tabbar{display:none}
body[data-route=quiz] main{max-width:none;padding:0}
.title{margin:0;font-size:clamp(28px,3.6vw,40px);line-height:1.12;letter-spacing:-.02em;font-weight:700;text-wrap:balance}
.h2{margin:0;font-size:20px;line-height:1.3;letter-spacing:-.01em;font-weight:700}
.sub{margin:8px 0 0;color:var(--ink2)}
.small{font-size:13.5px;line-height:1.5;color:var(--mute)}
p{margin:0}
.sec{margin-top:36px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;margin-bottom:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:calc(14px*var(--rk));padding:20px}
.card>.h2+*{margin-top:6px}
.stack>*+*{margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border:1px solid var(--ink);border-radius:calc(10px*var(--rk));background:var(--ink);color:var(--onfill);font-weight:600;font-size:15px;line-height:1.2;text-decoration:none;cursor:pointer;white-space:nowrap;transition:transform .12s ease,border-color .15s ease}
.btn:active{transform:translateY(1px)}
.btn.line{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.line:hover{border-color:var(--ink)}
.btn.red{background:var(--red);border-color:var(--red);color:var(--onred)}
.btn.big{width:100%;min-height:52px;font-size:16.5px}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.42;cursor:not-allowed}
.linkbtn{padding:0;border:0;background:none;color:var(--redt);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px;min-height:32px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 15px;border:1px solid var(--line);border-radius:var(--pill);background:var(--paper);color:var(--ink2);font-size:14.5px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--onfill)}
.chip small{font-size:13px;opacity:.8}

/* ---------- wrong-answer note logic: spaced repetition ---------- */
const IV=[1,3,7];
function applyNote(st,ok,un,t){
 const active=st.box!=null&&!st.done;
 if(!ok){st.box=0;st.done=0;st.due=t+DAY;st.wr=(st.wr||0)+1;st.lw=t;return}
 if(un){if(active) st.due=t+DAY; else if(U.settings.unsureNote){st.box=0;st.done=0;st.due=t+DAY} return}
 if(active){st.box+=1; if(st.box>=3){st.done=1;st.dt=t} else st.due=t+IV[st.box]*DAY}
}
function record(q,ch,ok,un,ms,fr){
 const qs=U.q[q.exam]; const st=qs[q.id]||(qs[q.id]={a:[]}); st.a=st.a||[];
 const t=Date.now(), rec=[t,ch||0,ok?1:0,un?1:0,Math.round(ms||0)]; if(fr>0&&fr<1){rec[5]=0; rec[6]=Math.round(fr*100)} // 필답형 부분 점수
 st.a.push(rec);
 if(st.a.length>12) st.a.splice(0,st.a.length-12);
 applyNote(st,ok,un,t); st.m=t;
 persist([qKey(q.exam,q.id)]);
 return st;
}

function hasReal(ex){const qs=U.q[ex];for(const id in qs) if(qs[id].a&&qs[id].a.length) return true; return U.sessions[ex].length>0}
function isDemo(ex=U.settings.exam){return !EXAMS[ex].vocab&&!U.settings.demoOff[ex]&&BANK.ready&&BANK.ex[ex].length>0&&!hasReal(ex)}
function demo(ex){
 if(DEMO[ex]) return DEMO[ex];
 const r=rng(hash('demo:'+ex)), now=Date.now(), sp=spq(TR(ex))*1000, q={};
 const save=U.settings.unsureNote; U.settings.unsureNote=true;
 BANK.ex[ex].forEach(x=>{
  if(r()>0.82) return;
  const p=(DSK[ex]||{})[x.subject]!=null?DSK[ex][x.subject]:0.6;
  const n=1+(r()<.55?1:0)+(r()<.25?1:0);
  const times=Array.from({length:n},()=>now-Math.floor((0.08+r()*24)*DAY)).sort((a,b)=>a-b);
  const st={a:[]};
  times.forEach((t,k)=>{
   const ok=r()<Math.min(.95,p+k*.08), un=ok?(r()<.28?1:0):(r()<.55?1:0);
   let ch=x.answer; if(!ok){ch=1+Math.floor(r()*x.choices.length); if(ch===x.answer) ch=ch%x.choices.length+1}
   const a=[t,ch,ok?1:0,un,Math.round(sp*(0.55+r()*0.9)*(ok?0.9:1.25))];
   if(!ok&&r()<.8) a[5]=['c','f','m'][Math.floor(r()*3)];
   if(x.kind&&!ok&&r()<.6){a[5]=a[5]||0; a[6]=[25,33,50,67,75][Math.floor(r()*5)]}
   st.a.push(a); applyNote(st,ok,!!un,t); st.m=t;
  });
  q[x.id]=st;
 });

}
const QS=ex=>isDemo(ex)?demo(ex).q:U.q[ex];

/* ---------- analytics ---------- */
function subjStats(ex,tr,since=0){
 const qs=QS(ex), m={};
 tr.subjects.forEach(s=>m[s]={s,n:0,c:0,att:0,ac:0,pt:0,pe:0,ms:0,mn:0});
 for(const id in qs){
  const q=BANK.all.get(id); if(!q||q.exam!==ex) continue;
  const o=m[subjOf(q,tr)]; if(!o) continue;
  const at=(qs[id].a||[]).filter(a=>a[0]>=since); if(!at.length) continue;
  const last=at[at.length-1]; o.n++; o.c+=last[2]; o.pt+=q.points||1; o.pe+=(last[6]!=null?last[6]/100:last[2])*(q.points||1);
  at.forEach(a=>{o.att++;o.ac+=a[2];if(a[4]){o.ms+=a[4];o.mn++}});
 }
 return tr.subjects.map(s=>{const o=m[s];o.score=o.n?Math.round((EXAMS[ex].open&&o.pt?o.pe/o.pt:o.c/o.n)*100):null;o.acc=o.att?o.ac/o.att:null;o.sec=o.mn?o.ms/o.mn/1000:null;return o});
}
function topicStats(ex,tr,since=0){
 const qs=QS(ex), m=new Map();
 POOL(ex,tr).forEach(q=>{const s=subjOf(q,tr),k=s+'›'+q.topic; if(!m.has(k)) m.set(k,{k,s,t:q.topic,bank:0,att:0,ac:0,mis:0,un:0,last:0,qids:[]}); const o=m.get(k); o.bank++; o.qids.push(q.id)});
 m.forEach(o=>{
  o.qids.forEach(id=>{const st=qs[id]; if(!st) return; (st.a||[]).forEach(a=>{if(a[0]<since) return; o.att++; o.ac+=a[2]; if(!a[2]&&!a[3]) o.mis++; if(a[3]) o.un++; if(a[0]>o.last) o.last=a[0]})});
  o.m=(o.ac+1)/(o.att+2); o.acc=o.att?o.ac/o.att:null;
 });
 return [...m.values()];
}
function predict(ex,tr,since=0){
 const ss=subjStats(ex,tr,since), p=tr.pass;
 if(p.type==='vocab'){
  const qs=QS(ex), pool=POOL(ex,tr).filter(q=>q.v); let known=0,learn=0,seen=0;
  pool.forEach(q=>{const k=wstate(qs[q.id]); if(k==='new') return; seen++; if(k==='known') known++; else if(k==='learn') learn++});
  return {type:'vocab',ss,total:pool.length,known,learn,seen,cov:pool.length?known/pool.length:0,none:!seen,ok:pool.length?known/pool.length*100>=p.goal:false};
 }
 if(p.type==='rc'){ // 실제 RC의 파트별 문항 수로 가중한 예상 정답률
  const have=ss.filter(o=>o.n>0); if(!have.length) return {none:true,ss,type:'rc',goal:p.goal};
  const W=p.w||{}, ov=sum(have.map(o=>o.c))/sum(have.map(o=>o.n)), est=o=>(o.c+4*ov)/(o.n+4)*100; // 파트별 문항이 적으면 전체 정답률 쪽으로 당겨요
  const wt=sum(have.map(o=>W[o.s]||1)), score=Math.round(sum(have.map(o=>est(o)*(W[o.s]||1)))/wt), missing=ss.filter(o=>!o.n);
  return {type:'rc',ss,score,goal:p.goal,missing,ok:!missing.length&&score>=p.goal};
 }
 if(p.type==='avg'){
  const have=ss.filter(o=>o.n>0);
  if(!have.length) return {none:true,ss,type:'avg'};
  const avg=Math.round(sum(have.map(o=>o.score))/have.length);
  const fails=have.filter(o=>o.score<p.min), missing=ss.filter(o=>!o.n);
  return {type:'avg',ss,avg,fails,missing,ok:!fails.length&&!missing.length&&avg>=p.avg};
 }
 const tp=sum(ss.map(o=>o.pt)); if(!tp) return {none:true,ss,type:'grade'};
 const score=Math.round(sum(ss.map(o=>o.pe))/tp*100), g=p.grades.find(x=>score>=x[0]);
 return {type:'grade',ss,score,grade:g?g[1]:null,ok:!!g,need:p.grades[p.grades.length-1][0],low:p.grades[p.grades.length-1][1]};
}
function predShort(pr){
 if(pr.type==='vocab') return pr.known+'<small> / '+pr.total+'</small>';

}
function headline(pr,tr){

 if(pr.type==='vocab') return `${tr.name} 단어 ${pr.total}개 중 ${pr.known}개를 외웠어요`;
 if(pr.type==='rc'){
  if(tr.pass.cut&&pr.score<tr.pass.cut) return `예상 정답률 ${pr.score}%, 과락선(${tr.pass.cut}%) 아래예요`;
  if(pr.score<pr.goal) return `예상 정답률 ${pr.score}%, 목표 ${pr.goal}%까지 ${pr.goal-pr.score}%p 남았어요`;
  if(pr.missing.length) return `예상 정답률 ${pr.score}% · ${pr.missing[0].s} 기록이 아직 없어요`;
  return `목표 달성권이에요 · 예상 정답률 ${pr.score}%`;
 }
 if(pr.type==='avg'){
  if(pr.fails.length) return `${josa(pr.fails[0].s,'이/가')} 과락 위험이에요${pr.fails.length>1?' (외 '+(pr.fails.length-1)+'과목)':''}`;
  if(pr.missing.length) return `${josa(pr.missing[0].s,'은/는')} 아직 풀지 않았어요`;
  if(pr.avg<tr.pass.avg) return `평균 ${pr.avg}점, 합격선까지 ${tr.pass.avg-pr.avg}점 남았어요`;
  return `합격권이에요 · 예상 평균 ${pr.avg}점`;
 }
 if(!pr.grade) return `예상 ${pr.score}점, ${pr.low}까지 ${pr.need-pr.score}점 남았어요`;
 return `예상 ${pr.score}점, ${pr.grade} 수준이에요`;
}

function daily(ex,since=0){

}
function streak(ex){

}

/* ---------- picking questions ---------- */
function topicPriority(ex,tr){
 const ts=topicStats(ex,tr), pr=predict(ex,tr), sw={}, p=tr.pass;
 if(p.type==='avg') pr.ss.forEach(o=>{sw[o.s]=!o.n?1.2:o.score<p.min?2:o.score<p.avg?1.4:1});
 const tot=sum(ts.map(t=>t.bank))||1;
 ts.forEach(t=>{t.pri=(sw[t.s]||1)*Math.sqrt(t.bank/tot)*(1-t.m)*(t.att?1:.8)});
 return ts.sort((a,b)=>b.pri-a.pri);
}
function lastAt(st){return st&&st.a&&st.a.length?st.a[st.a.length-1]:null}
function buildPlan(ex=U.settings.exam){
 if(EXAMS[ex].rc) return rcPlan(ex);
 const tr=TR(ex), qs=QS(ex), pool=POOL(ex,tr), now=Date.now(), goal=goalOf(ex), V=!!EXAMS[ex].vocab;
 const R=rng(hash(ex+ymd(now))), used=new Set();
 const seen=pool.some(q=>lastAt(qs[q.id]));
 const due=pool.filter(q=>{const s=qs[q.id];return s&&s.box!=null&&!s.done&&s.due<=now}).sort((a,b)=>qs[a.id].due-qs[b.id].due).map(q=>q.id);
 const review=due.slice(0,V?goal:Math.round(goal*.4)); review.forEach(i=>used.add(i));
 const rest=goal-review.length;
 const weak=[], topics=[];
 if(seen){
  const wN=Math.round(rest*.6), tp=topicPriority(ex,tr).filter(t=>t.pri>0&&(!V||(t.att>=3&&t.m<.6))), per=Math.max(2,Math.ceil(wN/3));
  for(const t of tp){
   if(weak.length>=wN) break;
   const cand=t.qids.filter(id=>!used.has(id)).sort((a,b)=>{const ra=rank(qs[a]),rb=rank(qs[b]);return ra-rb});
   let k=0; for(const id of cand){if(weak.length>=wN||k>=per) break; weak.push(id); used.add(id); k++}
   const lab=V?t.s:ex==='history'?t.s.replace(/\(.*\)/,'')+' '+t.t:t.t; if(k&&topics.length<3&&!topics.includes(lab)) topics.push(lab);
  }
 }
 const fresh=[]; const fN=goal-review.length-weak.length;
 const seenAt=q=>lastAt(qs[q.id])?lastAt(qs[q.id])[0]:0, vk=q=>q.v?q.v.tier*1e7+(q.v.tsl||5000)*1000+q.v.n:0;
 const bySub=tr.subjects.map(s=>shuffle(pool.filter(q=>subjOf(q,tr)===s&&!used.has(q.id)),R).sort(V?(a,b)=>(seenAt(a)?1:0)-(seenAt(b)?1:0)||(seenAt(a)-seenAt(b))||vk(a)-vk(b):(a,b)=>seenAt(a)-seenAt(b)));
 let progress=true;
 while(fresh.length<fN&&progress){progress=false; for(const arr of bySub){const q=arr.shift(); if(q&&fresh.length<fN){fresh.push(q.id);used.add(q.id);progress=true}}}

 function rank(st){const l=lastAt(st); if(!l) return 0; if(!l[2]) return 1; return 2+l[0]/1e13}
}
function buildMock(ex=U.settings.exam){

 const tr=TR(ex), qs=QS(ex), pool=POOL(ex,tr), R=Math.random;
 const pref=a=>shuffle(a,R).sort((x,y)=>(lastAt(qs[x.id])?1:0)-(lastAt(qs[y.id])?1:0));
 if(tr.per){
  return tr.subjects.flatMap(s=>pref(pool.filter(q=>subjOf(q,tr)===s)).slice(0,tr.per).map(q=>q.id));
 }
 if(tr.quota){
  const used=new Set(), out=[];
  tr.subjects.forEach((s,i)=>pref(pool.filter(q=>subjOf(q,tr)===s)).slice(0,tr.quota[i]||0).forEach(q=>{used.add(q.id); out.push(q)}));
  pref(pool.filter(q=>!used.has(q.id))).slice(0,Math.max(0,tr.total-out.length)).forEach(q=>out.push(q));
  return out.sort((a,b)=>tr.subjects.indexOf(subjOf(a,tr))-tr.subjects.indexOf(subjOf(b,tr))).map(q=>q.id);
 }
 const picked=pref(pool).slice(0,tr.total);
 return picked.sort((a,b)=>tr.subjects.indexOf(subjOf(a,tr))-tr.subjects.indexOf(subjOf(b,tr))).map(q=>q.id);
}

function focusSet(k,ex=U.settings.exam){

  due:q=>{const s=qs[q.id];return s&&s.box!=null&&!s.done&&s.due<=now},

function board(ex,tr){
 const E=EXAMS[ex], ts=topicStats(ex,tr), ss=subjStats(ex,tr);
 if(!ts.length) return emptyBox('문제은행이 비어 있어요','문제은행 탭에서 문제를 가져오면 숙련도 답안지가 채워져요.');
 return `<div class="omr">${tr.subjects.map((s,i)=>{
  const rows=ts.filter(t=>t.s===s); if(!rows.length) return '';
  const o=ss[i], low=tr.pass.type==='avg'&&o.n&&o.score<tr.pass.min;
  return `<section class="ocol" aria-label="${esc(s)}"><header class="ocol-h">${E.ls==='과목'?`<span class="ocol-no">${i+1}과목</span>`:''}<b>${esc(s)}</b><span class="ocol-sc${low?' low':''}">${o.n?o.score+'<small>'+(tr.pass.type==='avg'?'점':'%')+'</small>':'<small>—</small>'}</span></header>${rows.map(t=>{
   const lv=t.att?Math.max(0,Math.min(5,Math.round(t.acc*5))):0, weak=t.att>=1&&t.m<.45;
   return `<button class="mrow" data-act="topic" data-s="${esc(t.s)}" data-t="${esc(t.t)}" aria-label="${esc(t.t)}, 숙련도 5칸 중 ${lv}칸${weak?', 약점':''}. 이 ${E.lt} 풀기"><span class="mt">${esc(t.t)}${weak?'<span class="wk">약점</span>':''}</span><span class="bubs" aria-hidden="true">${[0,1,2,3,4].map(k=>`<i class="bb${k<lv?' on':''}"></i>`).join('')}</span><span class="mv">${t.att?pct(t.acc)+'%':'—'}</span></button>`;
  }).join('')}</section>`;
 }).join('')}</div>`;
}
function strip(pr,tr){
 if(pr.none) return '';
 let txt='', bad=false;
 if(pr.type==='vocab'){
  const low=pr.ss.filter(o=>o.n>=5).sort((a,b)=>a.score-b.score)[0];
  if(low&&low.score<60){bad=true; txt=`${esc(low.s)} 단어 정답률이 ${low.score}%로 가장 낮아요. 오늘의 학습에서 이 주제가 먼저 나와요.`}
  else txt=`외운 단어 ${pr.known}개, 복습 중 ${pr.learn}개예요. 복습부터 끝내야 간격 반복 효과가 가장 커요.`;
 } else if(pr.type==='rc'){
  const low=pr.ss.filter(o=>o.n>=4).sort((a,b)=>a.score-b.score)[0], LS=EXAMS[U.settings.exam].ls;
  if(tr.pass.cut&&pr.score<tr.pass.cut){bad=true; txt=`예상 정답률이 ${pr.score}%라 과락선 ${tr.pass.cut}%에 못 미쳐요.${low?' 가장 낮은 '+esc(low.s)+'('+low.score+'%)부터 끌어올리세요.':''}`}
  else if(low&&low.score<pr.goal){bad=true; txt=`${esc(low.s)} 정답률이 ${low.score}%로 가장 낮아요. 오늘의 학습에서 약한 유형이 먼저 나와요.`}
  else if(pr.missing.length) txt=`${pr.missing.map(o=>esc(o.s)).join(', ')} 기록이 아직 없어요. ${LS}마다 한 번씩 풀어야 예상 정답률이 정확해져요.`;
  else txt=`모든 ${josa(LS,'이/가')} 목표 ${pr.goal}% 근처예요. 이제는 ${totalQ(tr)}문항을 ${tr.minutes}분 안에 다 푸는 연습이 중요해요.`;
 } else if(pr.type==='avg'){
  if(pr.fails.length){bad=true; txt=`${pr.fails.map(o=>esc(o.s)+' '+o.score+'점').join(', ')}. 40점 아래라 과락이에요. 이 ${EXAMS[U.settings.exam].ls}부터 끌어올리세요.`}
  else if(pr.missing.length) txt=`${pr.missing.map(o=>esc(o.s)).join(', ')}은(는) 아직 기록이 없어요. 한 번씩 풀어야 합격 예측이 정확해져요.`;
  else if(pr.avg<tr.pass.avg){bad=true; txt=`과락은 없지만 평균 ${pr.avg}점이라 ${tr.pass.avg}점까지 ${tr.pass.avg-pr.avg}점이 모자라요.`}
  else txt=`모든 ${EXAMS[U.settings.exam].ls}이 40점을 넘고 평균 ${pr.avg}점이에요. 지금처럼 유지하세요.`;
 } else {
  if(!pr.grade){bad=true; txt=`예상 ${pr.score}점이라 ${pr.low}(${pr.need}점)까지 ${pr.need-pr.score}점이 모자라요.`}
  else txt=EXAMS[U.settings.exam].open?`예상 ${pr.score}점으로 ${pr.grade}이에요. 배점이 큰 계산 문제와 약한 분야를 챙기면 더 안전해져요.`:`예상 ${pr.score}점으로 ${pr.grade} 수준이에요. 3점짜리 문항과 약한 시대를 챙기면 더 올라가요.`;
 }
 return `<div class="strip${bad?' bad':''}"><p>${txt}</p><a class="btn line sm" href="#stats">분석 자세히 보기</a></div>`;
}

function customIds(){
 const ex=U.settings.exam, tr=TR(ex), qs=QS(ex), C=UI.custom;
 return POOL(ex,tr).filter(q=>(!C.subs.length||C.subs.includes(subjOf(q,tr)))&&(!C.tops.length||C.tops.includes(q.topic))).filter(q=>{
  const st=qs[q.id], l=lastAt(st);
  if(C.scope==='new') return !l; if(C.scope==='wrong') return st&&st.wr; if(C.scope==='star') return st&&st.star; return true;

const exLabel=n=>{const i=n.indexOf(' '); return i<0?esc(n):`<small>${esc(n.slice(0,i))}</small> ${esc(n.slice(i+1))}`}; // 좁은 화면에서는 '건축 / 필기'처럼 두 줄로
const fmtNum=v=>(+v).toLocaleString('ko-KR',{maximumFractionDigits:4});
const ptsOf=(f,p)=>+((f||0)*(p||1)).toFixed(1);

 }

 const acc=r.n?Math.round(r.c/r.n*100):0;
 let big, verdict='';
 if(mockish&&tr.pass.type==='avg'){big=`${r.avg}<small>점 평균</small>`; verdict=`<span class="verdict ${r.ok?'ok':'bad'}">${r.ok?ico('check')+'합격권':ico('x')+'불합격권'}</span>`}
 else if(mockish&&tr.pass.type==='vocab'){big=`${r.score}<small>점</small>`; verdict=`<span class="verdict ${r.ok?'ok':'bad'}">${r.ok?ico('check')+'통과':ico('x')+'80% 미만'}</span>`}
 else if(mockish&&tr.pass.type==='rc'){big=`${r.c}<small> / ${r.n} 정답 · ${r.score}%</small>`; verdict=`<span class="verdict ${r.ok?'ok':'bad'}">${r.ok?ico('check')+'목표 '+tr.pass.goal+'% 달성':ico('x')+(tr.pass.cut&&r.score<tr.pass.cut?'과락선 '+tr.pass.cut+'% 미만':'목표 '+tr.pass.goal+'% 미만')}</span>`}
 else if(mockish){big=`${r.score}<small>점</small>`; verdict=`<span class="verdict ${r.ok?'ok':'bad'}">${r.grade?r.grade+' 수준':'미달'}</span>`}
 else big=r.pt?`${r.pe}<small> / ${r.pt}점 · ${Math.round(r.pe/r.pt*100)}%</small>`:`${r.c}<small> / ${r.n} 정답 · ${acc}%</small>`;
 const rows=Object.entries(r.subj).filter(([,o])=>o.n).map(([s,o])=>{const v=Math.round((E.open&&o.pt?o.pe/o.pt:o.c/o.n)*100), low=tr.pass.type==='avg'&&mockish&&v<tr.pass.min; return `<div class="srow${E.open?' pts':''}"><span class="nm">${esc(s)}</span><div class="trk" role="img" aria-label="${esc(s)} ${v}${tr.pass.type==='avg'?'점':'%'}"><i class="${low?'low':''}" style="width:${v}%"></i>${tr.pass.type==='avg'?`<b class="ref" style="left:${tr.pass.min}%"></b><b class="ref pass" style="left:${tr.pass.avg}%"></b>`:''}</div><span class="val">${E.open?`${+o.pe.toFixed(1)}<small>/${o.pt}점</small>`:o.c+'/'+o.n}</span>${low?`<span class="sflag">${ico('x')}과락 (${v}점)</span>`:''}</div>`}).join('');
 const wrongs=r.wrong.map(id=>BANK.all.get(id)).filter(Boolean);
 return `<header class="rhead"><div><p class="sub" style="margin:0 0 6px">${esc(r.title)} · ${r.mode==='exam'?'시험 모드':'학습 모드'} · ${mmss(r.el)}${r.limit?' / '+mmss(r.limit):''}</p><div class="big">${big}</div></div>${verdict}</header>
 <div class="grid2 sec"><section class="card"><h2 class="h2">${E.ls}별 결과</h2>${tr.pass.type==='avg'&&mockish?'<p class="small">세로선은 과락 40점, 합격 평균 60점이에요.</p>':''}<div class="srows">${rows&&tr.pass.type==='avg'&&mockish?`<div class="srow" aria-hidden="true"><span></span><div class="axis"><span style="left:${tr.pass.min}%">${tr.pass.min}</span><span style="left:${tr.pass.avg}%">${tr.pass.avg}</span></div><span></span></div>`:''}${rows||'<p class="small">채점한 문제가 없어요.</p>'}</div>${tr.pace?rcPaceRows(r,tr):''}</section>
 <section class="card stack"><h2 class="h2">다음에 할 일</h2><p class="sub">${wrongs.length?`틀린 ${wrongs.length}${UN}${r.unsure.length?'와 헷갈린 '+r.unsure.length+UN:''}는 오답노트에 담겼어요. 내일 다시 나와요.`:`모두 맞혔어요. 헷갈린 ${UN}만 한 번 더 보세요.`}</p><div class="row">${wrongs.length?`<button class="btn" data-act="retry">틀린 ${UN} 바로 다시 풀기</button>`:''}<a class="btn line" href="#notes">오답노트</a><a class="btn line" href="#home">홈으로</a></div></section></div>
 ${wrongs.length?`<section class="sec"><div class="sec-h"><h2 class="h2">틀린 ${UN} 다시 보기</h2><span class="small">${wrongs.length}${UN}</span></div><div class="nlist">${wrongs.map(q=>noteCard(q,U.q[q.exam][q.id],'res')).join('')}</div></section>`:''}`;

function rcPaceRows(r,tr){
 const rows=Object.entries(r.subj).filter(([s,o])=>o.n&&o.ms&&tr.pace&&tr.pace[s]).map(([s,o])=>{const sec=o.ms/o.n/1000, p=tr.pace[s], w=Math.min(100,sec/(p*2)*100); return `<div class="srow"><span class="nm">${esc(s)}</span><div class="trk" role="img" aria-label="${esc(s)} 문항당 ${Math.round(sec)}초, 권장 ${p}초"><i class="${sec>p?'low':''}" style="width:${Math.max(1,w)}%"></i><b class="ref pass" style="left:50%"></b></div><span class="val">${Math.round(sec)}초</span></div>`}).join('');
 return rows?`<h3 class="h2" style="font-size:17px;margin-top:22px">문항당 풀이 시간</h3><p class="small">검은 선이 ${EXAMS[r.exam||U.settings.exam].rc?'파트별 권장 시간(Part 5 20초 · Part 6 30초 · Part 7 약 1분)':'문항당 90초(60분 ÷ 40문항)'}이에요. 빨간 막대는 그보다 느려요.</p><div class="srows">${rows}</div>`:'';
}
function rcPaceCard(ex,tr,pr){
 const have=pr.ss.filter(o=>o.sec&&o.mn>=3);
 const est=sum(RCPARTS.map(s=>{const o=have.find(x=>x.s===s); return (o?o.sec:tr.pace[s])*RCW[s]}))/60;
 const rows=RCPARTS.map(s=>{const o=pr.ss.find(x=>x.s===s), sec=o&&o.mn>=3?o.sec:null, p=tr.pace[s], w=sec?Math.min(100,sec/(p*2)*100):0; return `<div class="srow"><span class="nm">${esc(s)}</span><div class="trk" role="img" aria-label="${esc(s)} 문항당 ${sec?Math.round(sec)+'초':'기록 없음'}, 권장 ${p}초">${sec?`<i class="${sec>p?'low':''}" style="width:${Math.max(1,w)}%"></i>`:''}<b class="ref pass" style="left:50%"></b></div><span class="val">${sec?Math.round(sec)+'초':'—'}</span></div>`}).join('');
 const tip=!have.length?'파트마다 3문항 이상 풀면 실전 시간을 예측해 줘요. 시험 모드로 풀면 실제 시험과 가장 비슷해요.':est>75.5?`지금 속도라면 RC 100문항에 약 ${Math.round(est)}분이 걸려요. 75분보다 ${Math.round(est-75)}분 더 필요해서 마지막 지문 몇 개를 못 풀 수 있어요. 가장 느린 파트부터 시간을 줄여 보세요.`:`지금 속도라면 RC 100문항을 약 ${Math.round(est)}분에 풀어요. 75분 안에 들어오니 남는 시간은 Part 7 검토에 쓰세요.`;
 return `<section class="card"><h2 class="h2">실전 시간 예측</h2><p class="small">파트별 평균 풀이 시간에 실제 문항 수(30·16·29·25)를 곱했어요. 기록이 없는 파트는 권장 시간으로 셈해요. 검은 선이 권장 시간이에요.</p><div class="srows" style="margin-top:12px">${rows}</div><p class="insight">${tip}</p></section>`;
}

function ncsPaceCard(ex,tr,pr){
 const S=tr.subjects, have=pr.ss.filter(o=>S.includes(o.s)&&o.sec&&o.mn>=3), N=totalQ(tr), M=tr.minutes;
 const est=sum(S.map((s,i)=>{const o=have.find(x=>x.s===s); return (o?o.sec:tr.pace[s])*(tr.quota[i]||0)}))/60;
 const rows=S.map(s=>{const o=pr.ss.find(x=>x.s===s), sec=o&&o.mn>=3?o.sec:null, p=tr.pace[s], w=sec?Math.min(100,sec/(p*2)*100):0; return `<div class="srow"><span class="nm">${esc(s)}</span><div class="trk" role="img" aria-label="${esc(s)} 문항당 ${sec?Math.round(sec)+'초':'기록 없음'}, 권장 ${p}초">${sec?`<i class="${sec>p?'low':''}" style="width:${Math.max(1,w)}%"></i>`:''}<b class="ref pass" style="left:50%"></b></div><span class="val">${sec?Math.round(sec)+'초':'—'}</span></div>`}).join('');
 const tip=!have.length?'영역마다 3문항 이상 풀면 실전 시간을 예측해 줘요. 시험 모드로 풀면 실제 시험과 가장 비슷해요.':est>M+0.5?`지금 속도라면 ${N}문항에 약 ${Math.round(est)}분이 걸려요. ${M}분보다 ${Math.round(est-M)}분 더 필요해서 끝의 몇 문제를 못 풀 수 있어요. 2분이 넘는 문제는 표시하고 넘기는 연습을 해 보세요.`:`지금 속도라면 ${N}문항을 약 ${Math.round(est)}분에 풀어요. ${M}분 안에 들어오니 남는 시간은 표시해 둔 문제를 다시 보는 데 쓰세요.`;
 return `<section class="card"><h2 class="h2">실전 시간 예측</h2><p class="small">영역별 평균 풀이 시간에 모의고사 문항 수(${tr.quota.join('·')})를 곱했어요. 기록이 없는 영역은 문항당 90초로 셈해요. 검은 선이 90초예요.</p><div class="srows" style="margin-top:12px">${rows}</div><p class="insight">${tip}</p></section>`;
}

function vNotes(){
 const ex=U.settings.exam, E=EXAMS[ex], tr=TR(ex), N=UI.notes, now=Date.now();
 if(!BANK.ready) return '<p class="small">문제은행을 불러오는 중이에요…</p>';
 const all=noteList(ex,tr);
 const cnt={due:all.filter(x=>!x.st.done&&x.st.due<=now).length,wait:all.filter(x=>!x.st.done&&x.st.due>now).length,done:all.filter(x=>x.st.done).length,all:all.length};
 let list=all.filter(x=>N.f==='all'||(N.f==='due'&&!x.st.done&&x.st.due<=now)||(N.f==='wait'&&!x.st.done&&x.st.due>now)||(N.f==='done'&&x.st.done));
 if(N.subj) list=list.filter(x=>subjOf(x.q,tr)===N.subj);

 if(N.q.trim()){const k=N.q.trim().toLowerCase(); list=list.filter(x=>((x.q.v?x.q.v.w+' '+x.q.v.ko:x.q.stem)+' '+x.q.topic+' '+(x.st.memo||'')).toLowerCase().includes(k))}
 const sorters={due:(a,b)=>a.st.due-b.st.due,recent:(a,b)=>(b.st.lw||0)-(a.st.lw||0),most:(a,b)=>(b.st.wr||0)-(a.st.wr||0)};

function vTypeCard(ex,tr){

 if(m&&c&&m.n>=8&&c.n>=8&&m.acc-c.acc>=.15) tip=`뜻은 ${pct(m.acc)}% 아는데 문장 속에서는 ${pct(c.acc)}%예요. 예문을 소리 내어 읽고 유형별 연습의 문맥 빈칸을 더 풀어 보세요.`;
 return `<section class="card"><h2 class="h2">문제 유형별 정답률</h2><p class="small">같은 단어라도 알아보는 것과 문장에서 쓰는 것은 달라요. 풀이 횟수 기준이에요.</p>${rows?`<div class="srows">${rows}</div><p class="insight">${tip}</p>`:'<p class="small" style="margin-top:8px">단어 문제를 풀면 유형별로 모여요.</p>'}</section>`;
}
function rolling(dl){return dl.map((o,i)=>{let n=0,c=0;for(let j=i;j>=0&&dl[j].d>o.d-7*DAY;j--){n+=dl[j].n;c+=dl[j].c}return {d:o.d,n,c,dn:o.n}})}
function strategy(pr,tr,ex){
 const E=EXAMS[ex]; if(pr.none) return '';
 const li=(b,t)=>`<li><b>${b}</b><span>${t}</span></li>`, out=[];
 if(pr.type==='vocab'){
  const qs=QS(ex), unseen=POOL(ex,tr).filter(q=>q.v&&!lastAt(qs[q.id])).length, per=Math.max(1,buildPlan(ex).fresh.length||Math.round(U.settings.goal/2)), dd=dday(ex);
  if(unseen) out.push(li('새 단어',`남은 ${unseen}개 · 지금처럼 하루 ${per}개씩이면 약 ${Math.ceil(unseen/per)}일${dd!=null&&dd>0?`. 시험(D-${dd}) 전에 다 보려면 하루 ${Math.ceil(unseen/dd)}개씩`:''}`));
  if(pr.learn) out.push(li('복습',`복습 중인 단어 ${pr.learn}개. 다시 나올 때마다 뜻 → 단어 → 문맥 순으로 어려워지고, 세 번 연속 맞히면 졸업해요.`));
  const weak=pr.ss.filter(o=>o.n>=5).sort((a,b)=>a.score-b.score).slice(0,2);
  if(weak.length&&weak[0].score<80) out.push(li('약한 주제',weak.map(o=>esc(o.s)+' '+o.score+'%').join(', ')+'. 오늘의 학습에서 먼저 나와요.'));
  const ty=vTypeStats(ex,tr), m=ty.find(x=>x.k==='m'), c=ty.find(x=>x.k==='c');
  if(m&&c&&m.n>=10&&c.n>=10&&m.acc-c.acc>=.15) out.push(li('문맥',`뜻 고르기는 ${pct(m.acc)}%인데 문맥 빈칸은 ${pct(c.acc)}%예요. 예문을 소리 내어 읽고 문맥 빈칸을 더 풀어 보세요.`));
 } else if(pr.type==='rc'){
  if(pr.score<pr.goal) out.push(li('목표까지',`예상 정답률 ${pr.score}% → ${pr.goal}%. 실제 ${E.rc?'RC ':''}${totalQ(tr)}문항으로 치면 ${Math.ceil((pr.goal-pr.score)*totalQ(tr)/100)}문제를 더 맞혀야 해요.`));
  const ts=topicStats(ex,tr).filter(t=>t.att>=3).sort((a,b)=>a.m-b.m).slice(0,2);
  if(ts.length&&ts[0].acc<.7) out.push(li('약한 유형',ts.map(t=>esc(t.s.replace(' 단일 지문','').replace(' 복수 지문',' 복수'))+' '+esc(t.t)+' '+pct(t.acc)+'%').join(', ')+'. 오늘의 학습에서 먼저 나와요.'));
  const slow=pr.ss.filter(o=>o.sec&&o.mn>=3&&tr.pace&&o.sec>tr.pace[o.s]*1.15).sort((a,b)=>b.sec/tr.pace[b.s]-a.sec/tr.pace[a.s])[0];
  if(slow) out.push(li('시간',`${esc(slow.s)}에서 문항당 ${Math.round(slow.sec)}초가 걸려요(권장 ${tr.pace[slow.s]}초). 시험 모드로 시간을 재며 풀어 보세요.`));
  if(pr.missing.length) out.push(li('진단',`${pr.missing.map(o=>esc(o.s)).join(', ')} 기록이 아직 없어요. ${E.rc?'미니':'실전'} 모의고사로 한 번에 진단할 수 있어요.`));
 } else if(pr.type==='avg'){
  const pts=Math.round(100/(tr.per||20)), have=pr.ss.filter(o=>o.n);
  pr.fails.forEach(o=>out.push(li('과락 탈출',`${esc(o.s)} ${o.score}점 → ${tr.pass.min}점까지 실제 시험 기준 ${Math.ceil((tr.pass.min-o.score)/pts)}문제 더 (한 문제 ${pts}점)`)));
  if(pr.avg<tr.pass.avg){const q=Math.ceil((tr.pass.avg-pr.avg)*tr.subjects.length/pts), mid=have.filter(o=>o.score>=tr.pass.min&&o.score<80).sort((a,b)=>a.score-b.score).slice(0,2); out.push(li('평균 올리기',`평균 ${pr.avg}점 → ${tr.pass.avg}점까지 시험 전체에서 ${q}문제 더${mid.length?'. '+mid.map(o=>esc(o.s)).join('·')+'에서 나눠 맞히는 게 빨라요':''}`))}
  else if(!pr.fails.length){const lo=have.slice().sort((a,b)=>a.score-b.score)[0]; out.push(li('안정권',`모든 ${E.ls}이 50점, 평균이 65점을 넘으면 실수 몇 개에도 버텨요.${lo?' 가장 낮은 '+esc(lo.s)+'('+lo.score+'점)부터 챙기세요.':''}`))}
  const hi=have.slice().sort((a,b)=>b.score-a.score)[0]; if(hi&&hi.score>=70&&have.length>1) out.push(li('유지',`${josa(esc(hi.s),'은/는')} ${hi.score}점이라 새 문제보다 복습 위주로 유지해요.`));
 } else {
  const next=tr.pass.grades.slice().reverse().find(g=>g[0]>pr.score);
  if(next) out.push(li(next[1]+'까지',`${next[0]-pr.score}점 더 · 2점 문항으로 치면 약 ${Math.ceil((next[0]-pr.score)/2)}문제`));
  const weakE=pr.ss.filter(o=>o.n).sort((a,b)=>a.score-b.score).slice(0,2);
  if(weakE.length) out.push(li('약한 시대',weakE.map(o=>esc(o.s)+' '+o.score+'%').join(', ')+'. 오늘의 학습에서 먼저 나와요.'));
  out.push(li('배점','3점 문항 하나가 1점 문항 세 개와 같아요. 배점 큰 문항부터 확실히 챙기세요.'));
 }
 return out.length?`<ul class="strat" aria-label="합격 전략">${out.join('')}</ul>`:'';
}

function drawTrend(fig,data,rv=.6){
 const draw=()=>{
  const W=fig.clientWidth,H=fig.clientHeight; if(!W||!H) return;
  const m={l:40,r:18,t:16,b:30}, iw=W-m.l-m.r, ih=H-m.t-m.b;
  const t0=data[0].d,t1=data[data.length-1].d, span=Math.max(DAY,t1-t0);
  const x=d=>m.l+(d-t0)/span*iw, y=v=>m.t+(1-v)*ih;
  const pts=data.map(o=>[x(o.d),y(o.c/o.n)]);
  const ticks=[0,.5,1].map(v=>`<line x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${m.l-8}" y="${y(v)+4}" text-anchor="end">${v*100}%</text>`).join('');
  const ref=`<line x1="${m.l}" x2="${W-m.r}" y1="${y(rv)}" y2="${y(rv)}" stroke="var(--red)" stroke-width="1.2"/>`;
  const xl=[data[0],data[data.length-1]].concat(W>=520&&data.length>4?[data[Math.floor(data.length/2)]]:[]).map(o=>`<text x="${x(o.d)}" y="${H-8}" text-anchor="middle">${md(o.d)}</text>`).join('');
  const path='M'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join('L');
  const dots=pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="var(--ink)" stroke="var(--paper)" stroke-width="2"/>`).join('');
  fig.innerHTML=`<svg viewBox="0 0 ${W} ${H}" aria-hidden="true">${ticks}${ref}<path d="${path}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}${xl}<line id="xh" x1="0" x2="0" y1="${m.t}" y2="${m.t+ih}" stroke="var(--mute)" visibility="hidden"/><rect x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent" id="hit"/></svg><div class="tip" hidden></div>`;
  const tip=fig.querySelector('.tip'), xh=fig.querySelector('#xh');
  const show=e=>{const r=fig.getBoundingClientRect(), px=e.clientX-r.left; let bi=0,bd=1e9; pts.forEach((p,i)=>{const dd=Math.abs(p[0]-px); if(dd<bd){bd=dd;bi=i}}); const o=data[bi],p=pts[bi]; xh.setAttribute('x1',p[0]); xh.setAttribute('x2',p[0]); xh.setAttribute('visibility','visible'); tip.hidden=false; tip.style.left=Math.min(Math.max(p[0],70),W-70)+'px'; tip.style.top=p[1]+'px'; tip.textContent=''; const b=document.createElement('b'); b.textContent=pct(o.c/o.n)+'%'; tip.append(b,document.createTextNode(' 최근 7일'),document.createElement('br'),document.createTextNode(ymd(o.d)+' · 이날 '+o.dn+'문제'))};
  const hit=fig.querySelector('#hit'); hit.addEventListener('pointermove',show); hit.addEventListener('pointerdown',show); hit.addEventListener('pointerleave',()=>{tip.hidden=true; xh.setAttribute('visibility','hidden')});
 };
 const ro=new ResizeObserver(draw); ro.observe(fig); OBS.push(ro);
}

function parseImport(text){

 const arr=Array.isArray(j)?j:(j&&Array.isArray(j.questions)?j.questions:null);
 if(!arr) return {fatal:'문제 배열을 찾지 못했어요. [ ... ] 이나 { "questions": [ ... ] } 형태여야 해요.'};
 const defEx=!Array.isArray(j)&&j.exam||null, ok=[], errs=[], seen=new Set();
 const jb=!Array.isArray(j)&&j.bank&&typeof j.bank==='object'?j.bank:null, bank=jb?{id:String(jb.id||'').replace(/[^\w-]/g,'').slice(0,40),name:String(jb.name||'').slice(0,60),local:!!jb.local}:null;
 arr.forEach((r,i)=>{const {q,err}=normQ(r,defEx,'imp'); if(err){errs.push(`${i+1}번째: ${err}`);return} if(seen.has(q.id)){errs.push(`${i+1}번째: id "${q.id}"가 파일 안에서 겹쳐요`);return} seen.add(q.id); delete q.bank; ok.push(q)});
 const byEx={}; ok.forEach(q=>byEx[q.exam]=(byEx[q.exam]||0)+1);
 const known=ex=>new Set(EXAMS[ex].tracks.flatMap(t=>t.subjects.concat(Object.keys(t.map||{}))));
 return {bank,ok,errs,total:arr.length,byEx,replace:ok.filter(q=>BANK.all.has(q.id)).length,noExp:ok.filter(q=>!q.explanation).length,unknownSub:ok.filter(q=>!known(q.exam).has(q.subject)).length};
}

 if(u==='Y') return Math.floor(mon/12); if(u==='M') return mon; if(u==='D') return e-s; if(u==='YM') return mon%12;

/* 찾기와 참조 */
const lkEq=(v,x)=>{if(typeof x==='string'&&/[*?]/.test(x)) return typeof v==='string'&&wild(x).test(v); return v!==null&&!isE(v)&&x!==null&&rank(v)===rank(x)&&cmpv(v,x)===0};
const approx=(vals,x,down)=>{let k=-1; for(let i=0;i<vals.length;i++){const v=vals[i]; if(v===null||isE(v)||x===null||rank(v)!==rank(x)) continue; const c=cmpv(v,x); if(down?c>=0:c<=0) k=i} return k};
const vec=v=>{const A=asArr(v).a; return A.length===1?A[0]:A.map(r=>r[0])};
const flag=(a,i,d)=>{if(!has(a,i)) return d; const b=toBool(sc(a[i])); if(isE(b)) throw b; return b};
def('VLOOKUP',a=>{const x=sc(a[0]); if(isE(x)) return x; const T=asArr(a[1]).a, ci=Math.floor(nn(sc(a[2]))), ap=flag(a,3,true); if(ci<1) return EVAL; if(ci>T[0].length) return EREF; const col=T.map(r=>r[0]), k=ap?approx(col,x):col.findIndex(v=>lkEq(v,x)); return k<0?ENA:T[k][ci-1]});
def('HLOOKUP',a=>{const x=sc(a[0]); if(isE(x)) return x; const T=asArr(a[1]).a, ri=Math.floor(nn(sc(a[2]))), ap=flag(a,3,true); if(ri<1) return EVAL; if(ri>T.length) return EREF; const k=ap?approx(T[0],x):T[0].findIndex(v=>lkEq(v,x)); return k<0?ENA:T[ri-1][k]});
def('LOOKUP',a=>{const x=sc(a[0]); if(isE(x)) return x; const A=asArr(a[1]).a, wide=A[0].length>A.length, L=wide?A[0]:A.map(r=>r[0]), k=approx(L,x); if(k<0) return ENA; if(has(a,2)){const R=vec(a[2]); return k<R.length?R[k]:ENA} return wide?A[A.length-1][k]:A[k][A[0].length-1]});
def('MATCH',a=>{const x=sc(a[0]); if(isE(x)) return x; const L=vec(a[1]), t=has(a,2)?nn(sc(a[2])):1, k=t===0?L.findIndex(v=>lkEq(v,x)):approx(L,x,t<0); return k<0?ENA:k+1});
def('INDEX',a=>{const A=asArr(a[0]).a, R=A.length, C=A[0].length; let r=has(a,1)?Math.floor(nn(sc(a[1]))):0, c=has(a,2)?Math.floor(nn(sc(a[2]))):0;
 if(a.length<3&&R===1&&C>1){c=r; r=1}
 if(r<0||c<0||r>R||c>C) return EREF;
 if(r===0&&c===0) return R===1&&C===1?A[0][0]:{a:A};
 if(r===0) return R===1?A[0][c-1]:{a:A.map(row=>[row[c-1]])};
 if(c===0) return C===1?A[r-1][0]:{a:[A[r-1]]};
 return A[r-1][c-1]});
def('CHOOSE',a=>{const k=Math.floor(nn(sc(a[0]))); return k<1||k>=a.length?EVAL:a[k]});
def('ROW',(a,cx)=>{const g=a[0]; if(!has(a,0)) return cx.r; if(!isR(g)) return isE(g)?g:EVAL; if(g.r1===g.r2) return g.r1; const o=[]; for(let r=g.r1;r<=g.r2;r++) o.push([r]); return {a:o}});
def('COLUMN',(a,cx)=>{const g=a[0]; if(!has(a,0)) return cx.c; if(!isR(g)) return isE(g)?g:EVAL; if(g.c1===g.c2) return g.c1; const o=[]; for(let c=g.c1;c<=g.c2;c++) o.push(c); return {a:[o]}});
def('ROWS',a=>isE(a[0])?a[0]:asArr(a[0]).a.length); def('COLUMNS',a=>isE(a[0])?a[0]:asArr(a[0]).a[0].length);
def('OFFSET',a=>{const g=a[0]; if(!isR(g)) return isE(g)?g:EVAL; const dr=Math.trunc(nn(sc(a[1]))), dc=Math.trunc(nn(sc(a[2]))), h=has(a,3)?Math.trunc(nn(sc(a[3]))):g.r2-g.r1+1, w=has(a,4)?Math.trunc(nn(sc(a[4]))):g.c2-g.c1+1, r1=g.r1+dr, c1=g.c1+dc; if(r1<1||c1<1||h<1||w<1) return EREF; return {sh:g.sh,r1,c1,r2:r1+h-1,c2:c1+w-1}});
def('INDIRECT',(a,cx)=>{const g=rangeOf(st(sc(a[0])).trim()); return g?Object.assign({sh:cx.sh},g):EREF});
def('ADDRESS',S(a=>{const r=Math.floor(nn(a[0])), c=Math.floor(nn(a[1])), t=has(a,2)?Math.floor(nn(a[2])):1; if(r<1||c<1||t<1||t>4) return EVAL; return (t===1||t===3?'$':'')+colName(c)+(t===1||t===2?'$':'')+r}));
def('TRANSPOSE',a=>{const A=asArr(a[0]).a; return {a:A[0].map((_,j)=>A.map(r=>r[j]))}});
const xfind=(L,x,mm,sm)=>{const idx=L.map((_,i)=>i); if(sm<0) idx.reverse(); let k=-1;
 if(mm===2){const re=wild(toStr(x)); k=idx.find(i=>typeof L[i]==='string'&&re.test(L[i]))} else k=idx.find(i=>L[i]!==null&&!isE(L[i])&&x!==null&&rank(L[i])===rank(x)&&cmpv(L[i],x)===0);
 if(k===undefined) k=-1;
 if(k<0&&(mm===-1||mm===1)){let best=-1; L.forEach((v,i)=>{if(v===null||isE(v)||rank(v)!==rank(x)) return; const c=cmpv(v,x); if(mm<0?c<0:c>0){if(best<0||(mm<0?cmpv(v,L[best])>0:cmpv(v,L[best])<0)) best=i}}); k=best}
 return k};
def('XLOOKUP',a=>{const x=sc(a[0]); if(isE(x)) return x; const LA=asArr(a[1]).a, RA=asArr(a[2]).a, col=LA[0].length===1, L=col?LA.map(r=>r[0]):LA[0], mm=has(a,4)?nn(sc(a[4])):0, sm=has(a,5)?nn(sc(a[5])):1, k=xfind(L,x,mm,sm);
 if(k<0) return has(a,3)?sc(a[3]):ENA; if(col){if(k>=RA.length) return ENA; return RA[0].length===1?RA[k][0]:{a:[RA[k]]}} if(k>=RA[0].length) return ENA; return RA.length===1?RA[0][k]:{a:RA.map(r=>[r[k]])}});
def('XMATCH',a=>{const x=sc(a[0]); if(isE(x)) return x; const k=xfind(vec(a[1]),x,has(a,2)?nn(sc(a[2])):0,has(a,3)?nn(sc(a[3])):1); return k<0?ENA:k+1});

/* 데이터베이스 함수와 고급 필터: 조건 범위의 같은 줄은 '그리고', 다른 줄은 '또는' */
const low=v=>toStr(v).trim().toLowerCase();
const truthy=v=>v===true||(typeof v==='number'&&v!==0);
function dbHit(db,cr){
 if(!isR(db)||!isR(cr)) throw EVAL;
 const sh=db.sh, heads=[], cols=[], rows=[], r0=db.r1+1;
 for(let c=db.c1;c<=db.c2;c++) heads.push(low(sh.val(db.r1,c)));
 for(let c=cr.c1;c<=cr.c2;c++){const h=low(sh.val(cr.r1,c)); cols.push(h===''?-1:heads.indexOf(h))}
 for(let r=r0;r<=db.r2;r++){
  let any=cr.r2===cr.r1;
  for(let q=cr.r1+1;q<=cr.r2&&!any;q++){
   let ok=true;
   for(let c=cr.c1;c<=cr.c2&&ok;c++){
    const ce=sh.cell(q,c); if(!ce) continue;
    const fi=cols[c-cr.c1];
    if(fi>=0){const v=sh.val(q,c); if(v===null||v==='') continue; if(isE(v)) throw v; ok=mkCrit(v,true)(sh.val(r,db.c1+fi))}
    else if(ce.ast) ok=truthy(top(ev(ce.ast,{sh,r,c,dr:r-r0,dc:0})));       // 수식 조건: 첫 자료 줄을 기준으로 쓴 수식을 줄마다 옮겨 계산
    else{const v=sh.val(q,c); if(typeof v==='boolean') ok=v}
   }
   if(ok) any=true;
  }
  if(any) rows.push(r);

  XL.rangeKeys(XL.rangeOf(t.af.crit)).forEach(a=>edit.add(a));

  for(const k in t.fmt){const g=XL.rangeOf(k); if(g&&g.c1>=L.c1&&g.c2<=L.c2) sh.fmts.push([{r1:o.r+1,c1:o.c+g.c1-L.c1,r2:o.r+L.r2-L.r1,c2:o.c+g.c2-L.c1},t.fmt[k]])}

 if(t.kind==='cf'&&XS.rule){try{XS.hit=sh.cf(t.cf.range,XS.rule)}catch(e){XS.rule=''}}
 XS.sel=t.kind==='cf'?'':t.kind==='calc'?XL.rangeKeys(XL.rangeOf(t.targets[0].range))[0]:XL.rangeKeys(XL.rangeOf(t.af.crit))[0];

function xlRefs(tx){   // 수식 글자 속의 주소(범위)와 색 번호

}

function xlSig(tx,ca){   // 커서가 들어 있는 함수의 인수 안내

function xlKey(k){
 if(!XS.ed){if(k==='enter'||k==='esc'||k==='cse') return; if(!xlEdit()) return}
 xlSyncIn();

 if(k==='cse') return xlCommit(true);
 if(k==='esc'){XS.ed=false; XS.msg=null; XS.pend=null; xlPaint(); return}
 if(k==='txt') return xlText();
 const keep=XS.pend;
 if(k==='bs'){if(XS.ca>0){XS.tx=XS.tx.slice(0,XS.ca-1)+XS.tx.slice(XS.ca); XS.ca--} XS.pend=null; XS.msg=null}

}
function xlExtend(){   // 방금 넣은 주소를 표의 아래(없으면 오른쪽) 끝까지 범위로
 const rt=XL.refTokens(XS.tx); let i=-1; rt.forEach((x,k)=>{if(x.q<=XS.ca) i=k}); const x=rt[i];

 const m=XL.addr(x.v), sh=XS.sh; let r=m.r, c=m.c;

async function xlFile(){
 const name='합격노트-엑셀연습.xlsx', type='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
 const fail=()=>openModal(`<h2 class="h2">이 화면에서는 파일을 받을 수 없어요</h2><p class="sub">홈 화면에 설치한 합격노트 앱이나 브라우저로 연 합격노트에서 '연습 파일 받기'를 눌러 주세요. 받은 파일은 PC의 엑셀이나 휴대폰의 엑셀 앱에서 열 수 있어요.</p><div class="modal-act"><button class="btn" data-act="close" data-autofocus>확인</button></div>`);
 try{
  if(window.claude) return fail();
  const blob=XLAB.file||await (await fetch('data/xlab.xlsx',{cache:'no-cache'})).blob(); XLAB.file=blob;
  if(IOS){const f=new File([blob],name,{type}); if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]}); return}}
  const u=URL.createObjectURL(new Blob([blob],{type})), a=document.createElement('a'); a.href=u; a.download=name; document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000); toast('연습 파일을 받았어요');
 }catch(e){if(e&&e.name==='AbortError') return; fail()}
}

function xlKeydown(e){   // PC 키보드: 수식 줄에서 Enter·Esc·F4, 시트에서 화살표·Enter
 const tg=e.target;
 if(tg.id==='xl-txt'){if(e.key==='Enter'){e.preventDefault(); XACT.xltxtok(); return true} return false}
 if(MODAL||!XLAB.by.has(UI.arg)) return false;
 if(XS.ed){
  if(e.key==='Enter'){e.preventDefault(); xlKey(e.ctrlKey&&e.shiftKey?'cse':'enter'); return true}
  if(e.key==='Escape'){e.preventDefault(); xlKey('esc'); return true}
  if(e.key==='F4'){e.preventDefault(); xlKey('f4'); return true}
  if(XS.native||e.metaKey||e.ctrlKey||e.altKey) return false;
  const k=e.key==='Backspace'?'bs':e.key==='ArrowLeft'?'left':e.key==='ArrowRight'?'right':e.key.length===1?e.key:'';
  if(k){e.preventDefault(); xlKey(k); return true}
  return false;
 }
 if(tg.tagName==='INPUT'||tg.tagName==='TEXTAREA'||e.metaKey||e.ctrlKey||e.altKey||XS.t.kind==='cf') return false;
 const d={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key];
 if(d&&XS.sel){const m=XL.addr(XS.sel), V=XL.rangeOf(XS.t.view), r=Math.max(V.r1,Math.min(V.r2,m.r+d[0])), c=Math.max(V.c1,Math.min(V.c2,m.c+d[1])); e.preventDefault(); XS.sel=XL.key(r,c); XS.msg=null; xlPaint(); const td=$('#xl-gridw td.x-sel'); if(td) td.scrollIntoView({block:'nearest',inline:'nearest'}); return true}
 if((e.key==='Enter'||e.key==='F2')&&XS.edit.has(XS.sel)&&tg.tagName!=='BUTTON'&&tg.tagName!=='A'){e.preventDefault(); xlEdit(); return true}
 return false;
}
