*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans);overflow-x:clip;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
img{max-width:100%}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
[hidden]{display:none!important}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.fill{fill:currentColor}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:10px max(16px,4vw);display:flex;align-items:center;gap:10px 20px;flex-wrap:wrap;min-height:64px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:18px;letter-spacing:-.01em;text-decoration:none;white-space:nowrap}
.brand svg{width:22px;height:22px}
.exams{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:var(--pill);background:var(--soft)}
.exams button{min-height:38px;padding:0 16px;border:0;border-radius:var(--pill);background:none;color:var(--ink2);font-weight:600;font-size:15px;cursor:pointer;white-space:nowrap}
.exams button[aria-selected=true]{background:var(--ink);color:var(--onfill)}
.tabs{display:flex;gap:2px;margin-left:auto}
.tabs a{display:flex;align-items:center;min-height:44px;padding:0 12px;text-decoration:none;color:var(--ink2);font-weight:500;white-space:nowrap}
.tabs a[aria-current=page]{color:var(--ink);font-weight:700;box-shadow:inset 0 -2px 0 var(--red)}
.sync{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--mute)}
.sync[data-s=on] i{background:var(--ink);border-color:var(--ink)}
.sync[data-s=saving] i{background:var(--red);border-color:var(--red)}
.sync[data-s=warn] i{border-color:var(--red)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;display:none;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;text-decoration:none;font-size:13px;color:var(--mute)}
.tabbar a[aria-current=page]{color:var(--ink);font-weight:700}
.tabbar a[aria-current=page] .ic{color:var(--red)}
main{display:block;max-width:1240px;margin:0 auto;padding:28px max(16px,4vw) 72px;outline:none}
main:focus,main:focus-visible{outline:none}
@media (max-width:859px){.tabs{display:none}.tabbar{display:grid}.top-in{min-height:0;padding-top:8px;padding-bottom:8px}.exams{order:3;width:100%}.exams button{flex:1;padding:0 8px}.sync{margin-left:auto}main{padding-top:20px;padding-bottom:calc(100px + env(safe-area-inset-bottom))}}
body[data-route=quiz] .top,body[data-route=quiz] .tabbar{display:none}
body[data-route=quiz] main{max-width:none;padding:0}
.title{margin:0;font-size:clamp(28px,3.6vw,40px);line-height:1.12;letter-spacing:-.02em;font-weight:700;text-wrap:balance}
.h2{margin:0;font-size:20px;line-height:1.3;letter-spacing:-.01em;font-weight:700}
.sub{margin:8px 0 0;color:var(--ink2)}
.small{font-size:13.5px;line-height:1.5;color:var(--mute)}
p{margin:0}
.sec{margin-top:36px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;margin-bottom:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:calc(14px*var(--rk));padding:20px}
.card>.h2+*{margin-top:6px}
.stack>*+*{margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border:1px solid var(--ink);border-radius:calc(10px*var(--rk));background:var(--ink);color:var(--onfill);font-weight:600;font-size:15px;line-height:1.2;text-decoration:none;cursor:pointer;white-space:nowrap;transition:transform .12s ease,border-color .15s ease}
.btn:active{transform:translateY(1px)}
.btn.line{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.line:hover{border-color:var(--ink)}
.btn.red{background:var(--red);border-color:var(--red);color:var(--onred)}
.btn.big{width:100%;min-height:52px;font-size:16.5px}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.42;cursor:not-allowed}
.linkbtn{padding:0;border:0;background:none;color:var(--redt);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px;min-height:32px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 15px;border:1px solid var(--line);border-radius:var(--pill);background:var(--paper);color:var(--ink2);font-size:14.5px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--onfill)}
.chip small{font-size:13px;opacity:.8}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:calc(6px*var(--rk));background:var(--soft);color:var(--ink2);font-size:13px;line-height:1.5;white-space:nowrap}
.tag.red{background:var(--tint);color:var(--redt)}

/* ---------- wrong-answer note logic: spaced repetition ---------- */
const IV=[1,3,7];
function applyNote(st,ok,un,t){

 if(!ok){st.box=0;st.done=0;st.due=t+DAY;st.wr=(st.wr||0)+1;st.lw=t;return}
 if(un){if(active) st.due=t+DAY; else if(U.settings.unsureNote){st.box=0;st.done=0;st.due=t+DAY} return}

}

  const o=m[subjOf(q,tr)]; if(!o) continue;

function predict(ex,tr,since=0){

 const R=rng(hash(ex+ymd(now))), used=new Set();

function buildMock(ex=U.settings.exam){

 if(tr.per){
  return tr.subjects.flatMap(s=>pref(pool.filter(q=>subjOf(q,tr)===s)).slice(0,tr.per).map(q=>q.id));
 }
 if(tr.quota){
  const used=new Set(), out=[];
  tr.subjects.forEach((s,i)=>pref(pool.filter(q=>subjOf(q,tr)===s)).slice(0,tr.quota[i]||0).forEach(q=>{used.add(q.id); out.push(q)}));

 }

function wordList(){
 const qs=QS('toeic'), W=UI.words, k=W.q.trim().toLowerCase();
 return BANK.ex.toeic.filter(q=>{
  const w=q.v; if(!w) return false;
  if(W.cat&&q.subject!==W.cat) return false;
  if(W.tier&&w.tier!==W.tier) return false;
  const st=qs[q.id];
  if(W.st==='star'){if(!(st&&st.star)) return false} else if(W.st!=='all'&&wstate(st)!==W.st) return false;
  if(k&&!(w.w.toLowerCase().includes(k)||w.ko.includes(k)||(w.fam||[]).some(f=>f[0].toLowerCase().includes(k))||(w.syn||[]).some(x=>x.toLowerCase().includes(k)))) return false;
  return true;
 });
}
function wrow(q,st){

 ${open?`<div class="wbody">${vCard(w)}<div class="row"><button class="btn sm" data-act="nretry" data-q="${esc(q.id)}">이 단어 퀴즈</button><button class="btn line sm" data-act="star" data-q="${esc(q.id)}" aria-pressed="${!!(st&&st.star)}">${st&&st.star?'북마크 해제':'북마크'}</button><span class="small">${esc(q.subject)} · ${WSTL[k]}${st&&st.box!=null&&!st.done?' · '+md(st.due)+' 복습':''}</span></div></div>`:''}

}

function board(ex,tr){
 const E=EXAMS[ex], ts=topicStats(ex,tr), ss=subjStats(ex,tr);
 if(!ts.length) return emptyBox('문제은행이 비어 있어요','문제은행 탭에서 문제를 가져오면 숙련도 답안지가 채워져요.');
 return `<div class="omr">${tr.subjects.map((s,i)=>{
  const rows=ts.filter(t=>t.s===s); if(!rows.length) return '';
  const o=ss[i], low=tr.pass.type==='avg'&&o.n&&o.score<tr.pass.min;
  return `<section class="ocol" aria-label="${esc(s)}"><header class="ocol-h">${E.ls==='과목'?`<span class="ocol-no">${i+1}과목</span>`:''}<b>${esc(s)}</b><span class="ocol-sc${low?' low':''}">${o.n?o.score+'<small>'+(tr.pass.type==='avg'?'점':'%')+'</small>':'<small>—</small>'}</span></header>${rows.map(t=>{
   const lv=t.att?Math.max(0,Math.min(5,Math.round(t.acc*5))):0, weak=t.att>=1&&t.m<.45;
   return `<button class="mrow" data-act="topic" data-s="${esc(t.s)}" data-t="${esc(t.t)}" aria-label="${esc(t.t)}, 숙련도 5칸 중 ${lv}칸${weak?', 약점':''}. 이 ${E.lt} 풀기"><span class="mt">${esc(t.t)}${weak?'<span class="wk">약점</span>':''}</span><span class="bubs" aria-hidden="true">${[0,1,2,3,4].map(k=>`<i class="bb${k<lv?' on':''}"></i>`).join('')}</span><span class="mv">${t.att?pct(t.acc)+'%':'—'}</span></button>`;
  }).join('')}</section>`;
 }).join('')}</div>`;
}
function strip(pr,tr){
 if(pr.none) return '';
 let txt='', bad=false;
 if(pr.type==='vocab'){
  const low=pr.ss.filter(o=>o.n>=5).sort((a,b)=>a.score-b.score)[0];
  if(low&&low.score<60){bad=true; txt=`${esc(low.s)} 단어 정답률이 ${low.score}%로 가장 낮아요. 오늘의 학습에서 이 주제가 먼저 나와요.`}
  else txt=`외운 단어 ${pr.known}개, 복습 중 ${pr.learn}개예요. 복습부터 끝내야 간격 반복 효과가 가장 커요.`;
 } else if(pr.type==='rc'){
  const low=pr.ss.filter(o=>o.n>=4).sort((a,b)=>a.score-b.score)[0];
  if(low&&low.score<pr.goal){bad=true; txt=`${esc(low.s)} 정답률이 ${low.score}%로 가장 낮아요. 오늘의 학습에서 약한 유형이 먼저 나와요.`}
  else if(pr.missing.length) txt=`${pr.missing.map(o=>esc(o.s)).join(', ')} 기록이 아직 없어요. 파트마다 한 번씩 풀어야 예상 정답률이 정확해져요.`;
  else txt=`모든 파트가 목표 ${pr.goal}% 근처예요. 이제는 75분 안에 다 푸는 연습이 중요해요.`;
 } else if(pr.type==='avg'){
  if(pr.fails.length){bad=true; txt=`${pr.fails.map(o=>esc(o.s)+' '+o.score+'점').join(', ')}. 40점 아래라 과락이에요. 이 ${EXAMS[U.settings.exam].ls}부터 끌어올리세요.`}
  else if(pr.missing.length) txt=`${pr.missing.map(o=>esc(o.s)).join(', ')}은(는) 아직 기록이 없어요. 한 번씩 풀어야 합격 예측이 정확해져요.`;
  else if(pr.avg<tr.pass.avg){bad=true; txt=`과락은 없지만 평균 ${pr.avg}점이라 ${tr.pass.avg}점까지 ${tr.pass.avg-pr.avg}점이 모자라요.`}
  else txt=`모든 ${EXAMS[U.settings.exam].ls}이 40점을 넘고 평균 ${pr.avg}점이에요. 지금처럼 유지하세요.`;
 } else {
  if(!pr.grade){bad=true; txt=`예상 ${pr.score}점이라 ${pr.low}(${pr.need}점)까지 ${pr.need-pr.score}점이 모자라요.`}
  else txt=`예상 ${pr.score}점으로 ${pr.grade} 수준이에요. 3점짜리 문항과 약한 시대를 챙기면 더 올라가요.`;
 }
 return `<div class="strip${bad?' bad':''}"><p>${txt}</p><a class="btn line sm" href="#stats">분석 자세히 보기</a></div>`;
}

function vTypeCard(ex,tr){

 if(m&&c&&m.n>=8&&c.n>=8&&m.acc-c.acc>=.15) tip=`뜻은 ${pct(m.acc)}% 아는데 문장 속에서는 ${pct(c.acc)}%예요. 예문을 소리 내어 읽고 유형별 연습의 문맥 빈칸을 더 풀어 보세요.`;
 return `<section class="card"><h2 class="h2">문제 유형별 정답률</h2><p class="small">같은 단어라도 알아보는 것과 문장에서 쓰는 것은 달라요. 풀이 횟수 기준이에요.</p>${rows?`<div class="srows">${rows}</div><p class="insight">${tip}</p>`:'<p class="small" style="margin-top:8px">단어 문제를 풀면 유형별로 모여요.</p>'}</section>`;
}
function rolling(dl){return dl.map((o,i)=>{let n=0,c=0;for(let j=i;j>=0&&dl[j].d>o.d-7*DAY;j--){n+=dl[j].n;c+=dl[j].c}return {d:o.d,n,c,dn:o.n}})}
function strategy(pr,tr,ex){
 const E=EXAMS[ex]; if(pr.none) return '';
 const li=(b,t)=>`<li><b>${b}</b><span>${t}</span></li>`, out=[];
 if(pr.type==='vocab'){
  const qs=QS(ex), unseen=POOL(ex,tr).filter(q=>q.v&&!lastAt(qs[q.id])).length, per=Math.max(1,buildPlan(ex).fresh.length||Math.round(U.settings.goal/2)), dd=dday(ex);
  if(unseen) out.push(li('새 단어',`남은 ${unseen}개 · 지금처럼 하루 ${per}개씩이면 약 ${Math.ceil(unseen/per)}일${dd!=null&&dd>0?`. 시험(D-${dd}) 전에 다 보려면 하루 ${Math.ceil(unseen/dd)}개씩`:''}`));
  if(pr.learn) out.push(li('복습',`복습 중인 단어 ${pr.learn}개. 다시 나올 때마다 뜻 → 단어 → 문맥 순으로 어려워지고, 세 번 연속 맞히면 졸업해요.`));
  const weak=pr.ss.filter(o=>o.n>=5).sort((a,b)=>a.score-b.score).slice(0,2);
  if(weak.length&&weak[0].score<80) out.push(li('약한 주제',weak.map(o=>esc(o.s)+' '+o.score+'%').join(', ')+'. 오늘의 학습에서 먼저 나와요.'));
  const ty=vTypeStats(ex,tr), m=ty.find(x=>x.k==='m'), c=ty.find(x=>x.k==='c');
  if(m&&c&&m.n>=10&&c.n>=10&&m.acc-c.acc>=.15) out.push(li('문맥',`뜻 고르기는 ${pct(m.acc)}%인데 문맥 빈칸은 ${pct(c.acc)}%예요. 예문을 소리 내어 읽고 문맥 빈칸을 더 풀어 보세요.`));
 } else if(pr.type==='rc'){
  if(pr.score<pr.goal) out.push(li('목표까지',`예상 정답률 ${pr.score}% → ${pr.goal}%. 실제 RC 100문항으로 치면 ${pr.goal-pr.score}문제를 더 맞혀야 해요.`));
  const ts=topicStats(ex,tr).filter(t=>t.att>=3).sort((a,b)=>a.m-b.m).slice(0,2);
  if(ts.length&&ts[0].acc<.7) out.push(li('약한 유형',ts.map(t=>esc(t.s.replace(' 단일 지문','').replace(' 복수 지문',' 복수'))+' '+esc(t.t)+' '+pct(t.acc)+'%').join(', ')+'. 오늘의 학습에서 먼저 나와요.'));
  const slow=pr.ss.filter(o=>o.sec&&o.mn>=3&&tr.pace&&o.sec>tr.pace[o.s]*1.15).sort((a,b)=>b.sec/tr.pace[b.s]-a.sec/tr.pace[a.s])[0];
  if(slow) out.push(li('시간',`${esc(slow.s)}에서 문항당 ${Math.round(slow.sec)}초가 걸려요(권장 ${tr.pace[slow.s]}초). 시험 모드로 시간을 재며 풀어 보세요.`));
  if(pr.missing.length) out.push(li('진단',`${pr.missing.map(o=>esc(o.s)).join(', ')} 기록이 아직 없어요. 미니 모의고사로 한 번에 진단할 수 있어요.`));
 } else if(pr.type==='avg'){
  const pts=Math.round(100/(tr.per||20)), have=pr.ss.filter(o=>o.n);
  pr.fails.forEach(o=>out.push(li('과락 탈출',`${esc(o.s)} ${o.score}점 → ${tr.pass.min}점까지 실제 시험 기준 ${Math.ceil((tr.pass.min-o.score)/pts)}문제 더 (한 문제 ${pts}점)`)));
  if(pr.avg<tr.pass.avg){const q=Math.ceil((tr.pass.avg-pr.avg)*tr.subjects.length/pts), mid=have.filter(o=>o.score>=tr.pass.min&&o.score<80).sort((a,b)=>a.score-b.score).slice(0,2); out.push(li('평균 올리기',`평균 ${pr.avg}점 → ${tr.pass.avg}점까지 시험 전체에서 ${q}문제 더${mid.length?'. '+mid.map(o=>esc(o.s)).join('·')+'에서 나눠 맞히는 게 빨라요':''}`))}
  else if(!pr.fails.length){const lo=have.slice().sort((a,b)=>a.score-b.score)[0]; out.push(li('안정권',`모든 ${E.ls}이 50점, 평균이 65점을 넘으면 실수 몇 개에도 버텨요.${lo?' 가장 낮은 '+esc(lo.s)+'('+lo.score+'점)부터 챙기세요.':''}`))}
  const hi=have.slice().sort((a,b)=>b.score-a.score)[0]; if(hi&&hi.score>=70&&have.length>1) out.push(li('유지',`${josa(esc(hi.s),'은/는')} ${hi.score}점이라 새 문제보다 복습 위주로 유지해요.`));
 } else {
  const next=tr.pass.grades.slice().reverse().find(g=>g[0]>pr.score);
  if(next) out.push(li(next[1]+'까지',`${next[0]-pr.score}점 더 · 2점 문항으로 치면 약 ${Math.ceil((next[0]-pr.score)/2)}문제`));
  const weakE=pr.ss.filter(o=>o.n).sort((a,b)=>a.score-b.score).slice(0,2);
  if(weakE.length) out.push(li('약한 시대',weakE.map(o=>esc(o.s)+' '+o.score+'%').join(', ')+'. 오늘의 학습에서 먼저 나와요.'));
  out.push(li('배점','3점 문항 하나가 1점 문항 세 개와 같아요. 배점 큰 문항부터 확실히 챙기세요.'));
 }
 return out.length?`<ul class="strat" aria-label="합격 전략">${out.join('')}</ul>`:'';
}

function drawTrend(fig,data){
 const draw=()=>{
  const W=fig.clientWidth,H=fig.clientHeight; if(!W||!H) return;
  const m={l:40,r:18,t:16,b:30}, iw=W-m.l-m.r, ih=H-m.t-m.b;
  const t0=data[0].d,t1=data[data.length-1].d, span=Math.max(DAY,t1-t0);
  const x=d=>m.l+(d-t0)/span*iw, y=v=>m.t+(1-v)*ih;
  const pts=data.map(o=>[x(o.d),y(o.c/o.n)]);

  const ref=`<line x1="${m.l}" x2="${W-m.r}" y1="${y(.6)}" y2="${y(.6)}" stroke="var(--red)" stroke-width="1.2"/>`;
  const xl=[data[0],data[data.length-1]].concat(W>=520&&data.length>4?[data[Math.floor(data.length/2)]]:[]).map(o=>`<text x="${x(o.d)}" y="${H-8}" text-anchor="middle">${md(o.d)}</text>`).join('');
  const path='M'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join('L');
  const dots=pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="var(--ink)" stroke="var(--paper)" stroke-width="2"/>`).join('');
  fig.innerHTML=`<svg viewBox="0 0 ${W} ${H}" aria-hidden="true">${ticks}${ref}<path d="${path}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}${xl}<line id="xh" x1="0" x2="0" y1="${m.t}" y2="${m.t+ih}" stroke="var(--mute)" visibility="hidden"/><rect x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent" id="hit"/></svg><div class="tip" hidden></div>`;
  const tip=fig.querySelector('.tip'), xh=fig.querySelector('#xh');
  const show=e=>{const r=fig.getBoundingClientRect(), px=e.clientX-r.left; let bi=0,bd=1e9; pts.forEach((p,i)=>{const dd=Math.abs(p[0]-px); if(dd<bd){bd=dd;bi=i}}); const o=data[bi],p=pts[bi]; xh.setAttribute('x1',p[0]); xh.setAttribute('x2',p[0]); xh.setAttribute('visibility','visible'); tip.hidden=false; tip.style.left=Math.min(Math.max(p[0],70),W-70)+'px'; tip.style.top=p[1]+'px'; tip.textContent=''; const b=document.createElement('b'); b.textContent=pct(o.c/o.n)+'%'; tip.append(b,document.createTextNode(' 최근 7일'),document.createElement('br'),document.createTextNode(ymd(o.d)+' · 이날 '+o.dn+'문제'))};
  const hit=fig.querySelector('#hit'); hit.addEventListener('pointermove',show); hit.addEventListener('pointerdown',show); hit.addEventListener('pointerleave',()=>{tip.hidden=true; xh.setAttribute('visibility','hidden')});
 };
 const ro=new ResizeObserver(draw); ro.observe(fig); OBS.push(ro);
}

function parseImport(text){
 let j; try{j=JSON.parse(text)}catch(e){return {fatal:'JSON 형식이 아니에요. 따옴표와 쉼표를 확인해 주세요.'}}
 const arr=Array.isArray(j)?j:(j&&Array.isArray(j.questions)?j.questions:null);
 if(!arr) return {fatal:'문제 배열을 찾지 못했어요. [ ... ] 이나 { "questions": [ ... ] } 형태여야 해요.'};
 const defEx=!Array.isArray(j)&&j.exam||null, ok=[], errs=[], seen=new Set();
 const jb=!Array.isArray(j)&&j.bank&&typeof j.bank==='object'?j.bank:null, bank=jb?{id:String(jb.id||'').replace(/[^\w-]/g,'').slice(0,40),name:String(jb.name||'').slice(0,60),local:!!jb.local}:null;
 arr.forEach((r,i)=>{const {q,err}=normQ(r,defEx,'imp'); if(err){errs.push(`${i+1}번째: ${err}`);return} if(seen.has(q.id)){errs.push(`${i+1}번째: id "${q.id}"가 파일 안에서 겹쳐요`);return} seen.add(q.id); delete q.bank; ok.push(q)});
 const byEx={}; ok.forEach(q=>byEx[q.exam]=(byEx[q.exam]||0)+1);
 const known=ex=>new Set(EXAMS[ex].tracks.flatMap(t=>t.subjects.concat(Object.keys(t.map||{}))));
 return {bank,ok,errs,total:arr.length,byEx,replace:ok.filter(q=>BANK.all.has(q.id)).length,noExp:ok.filter(q=>!q.explanation).length,unknownSub:ok.filter(q=>!known(q.exam).has(q.subject)).length};
}

 }

const VIEWS={home:vHome,practice:vPractice,quiz:vQuiz,result:vResult,notes:vNotes,stats:vStats,bank:vBank,words:vWords,cards:vCards,study:vStudy};

function grade(un){
 const s=U.active; if(!s||s.mode!=='study') return;
 const id=s.qids[s.i], q=BANK.all.get(id), a=s.ans[id]; if(!q||!a||!a.ch||a.g) return;
 const wasDemo=isDemo(q.exam);
 a.g=1; a.ok=a.ch===q.answer?1:0; a.un=un?1:0;
 record(q,a.ch,!!a.ok,un,a.ms); vtally(q,a.ok);
 s.tu=Date.now(); persist(['settings']);
 if(wasDemo) toast('이제부터 내 기록으로 분석해요');
 render(true);
 const h=$('#fbh'); if(h) h.focus({preventScroll:true});
 const nb=$('#nextbtn'); if(nb&&window.matchMedia('(min-width:900px)').matches){const fb=$('.fb'); if(fb) fb.scrollIntoView({block:'nearest',behavior:'smooth'})}
}

}
function noteEdit(id,fn,msg){
 const q=BANK.all.get(id); if(!q) return;

 const st=U.q[q.exam][id]; if(!st) return; fn(st); st.m=Date.now(); persist([qKey(q.exam,id)]); toast(msg); render(true);
}
function commitImport(rep=UI.imp.rep,name=UI.imp.name,quiet=false){
 if(!rep||!rep.ok||!rep.ok.length) return 0;
 const list=rep.ok.map(q=>Object.assign({},q));
 if(list.some(q=>new TextEncoder().encode(JSON.stringify(q)).length>BYTES)){toast('이미지가 너무 큰 문제가 있어 가져올 수 없어요. 이미지를 줄여 주세요.');return 0}
 const pics=list.reduce((n,q)=>n+(q.image?q.image.length:0),0), local=!!(rep.bank&&rep.bank.local)||pics>400000; // 그림이 많은 묶음은 이 기기에만
 const id=rep.bank&&rep.bank.id?'b'+rep.bank.id:'b'+uid(), old=U.banks.find(b=>b.id===id);
 const meta={id,name:(rep.bank&&rep.bank.name)||name||('가져온 문제 '+ymd(Date.now())),count:list.length,exams:Object.keys(rep.byEx),addedAt:Date.now()};
 if(local) meta.local=true;
 const stale=old&&!old.local?chunkBank(U.bankQ[id]||[]).map((_,n)=>'b-'+id+'-'+n):[];
 U.banks=U.banks.filter(b=>b.id!==id).concat(meta); U.bankQ[id]=list; rebuild(); U.settings.updatedAt=Date.now();
 if(local){IDB.set(bkey(id),list).then(ok=>{if(!ok) toast('이 브라우저에서는 큰 묶음을 저장하지 못했어요. 창을 닫으면 다시 가져와야 해요.')}); persist(['settings',...stale])}
 else persist(['settings',...new Set(stale.concat(chunkBank(list).map((_,n)=>'b-'+id+'-'+n)))]);
 if(!quiet){UI.imp={text:'',rep:null,name:''}; toast(meta.count+'문제를 가져왔어요'+(local?' · 이 기기에 저장했어요':'')); render(true)}
 return meta.count;
}
async function importFiles(files){
 let n=0, ok=0, bad=0; toast('파일을 읽는 중이에요…');
 for(const f of files){
  let rep=null; try{rep=parseImport(await f.text())}catch(e){}
  const c=rep&&!rep.fatal?commitImport(rep,f.name.replace(/\.json$/i,''),true):0;
  if(c){n+=c; ok++} else bad++;
 }
 UI.imp={text:'',rep:null,name:''};
 toast(ok?`파일 ${ok}개에서 ${n}문제를 가져왔어요`+(bad?` · ${bad}개는 형식이 맞지 않아 건너뛰었어요`:''):'가져올 수 있는 문제가 없어요. 파일 형식을 확인해 주세요.');
 render(true);
}

document.addEventListener('keydown',e=>{

  else if(C.flip&&/^[123]$/.test(e.key)){e.preventDefault(); ACT.crate({dataset:{v:String(+e.key-1)}})}
  return;
 }
 if(UI.route==='study'&&!MODAL&&!e.metaKey&&!e.ctrlKey&&!e.altKey){ // 단원 퀴즈가 화면에 보일 때만 숫자·O/X·Enter
  const S=UI.sq[UI.arg==='quiz'?'x':UI.arg], box=$('#sq'); if(!S||S.done||!box) return;
  const r=box.getBoundingClientRect(); if(r.bottom<80||r.top>innerHeight-80) return;
  let b=null;
  if(/^[1-4]$/.test(e.key)) b=$(`#sq .sq-o[data-n="${e.key}"]`);
  else if(/^[oOxX]$/.test(e.key)) b=$(`#sq .sq-ox .sq-o[data-v="${/o/i.test(e.key)?1:0}"]`);
  else if(e.key==='Enter'&&tag!=='button'&&tag!=='a') b=$('#sq-next');
  if(b&&!b.disabled){e.preventDefault(); b.click()}
  return;
 }
 if(UI.route!=='quiz'||!U.active||MODAL||e.metaKey||e.ctrlKey||e.altKey) return;
 const s=U.active, a=s.ans[s.qids[s.i]]||{}, onBtn=tag==='button'||tag==='a';
 const nk=EXAMS[s.exam].abc&&/^[a-dA-D]$/.test(e.key)?String('abcd'.indexOf(e.key.toLowerCase())+1):e.key;
 if(/^[1-5]$/.test(nk)){const b=$(`.ch[data-n="${nk}"]`); if(b&&!b.disabled){e.preventDefault(); b.click()}}
 else if(e.key==='Enter'&&!onBtn){e.preventDefault(); if(s.mode==='study'){if(a.g) ACT.next(); else if(a.ch) grade(e.shiftKey)} else ACT.next()}
 else if((e.key==='h'||e.key==='H')){if(s.mode==='study'&&a.ch&&!a.g) grade(true); else if(s.mode==='exam') ACT.flag()}
 else if(e.key==='ArrowRight'&&!onBtn){if(s.mode==='exam'||a.g) ACT.next()}
 else if(e.key==='ArrowLeft'&&!onBtn) ACT.prev();
});
